<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#111111" />
<title>Drone</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #111111;
    color: #e8e8e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 22px calc(24px + env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
  }
  .wrap { width: 100%; max-width: 420px; }
  .readout { text-align: center; margin-bottom: 30px; }
  .hz { font-size: 64px; font-weight: 300; letter-spacing: -0.02em; line-height: 1; }
  .hz span { font-size: 24px; color: #8a8a86; margin-left: 6px; }
  .note { font-size: 13px; color: #8a8a86; margin-top: 12px; min-height: 34px; line-height: 1.5; }
  .note.warn { color: #d8a35c; }
  .field { margin-bottom: 24px; }
  .label {
    display: flex; justify-content: space-between;
    font-size: 13px; color: #8a8a86; margin-bottom: 12px;
    letter-spacing: 0.02em;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 34px; background: transparent; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; background: #333331; border-radius: 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 30px; height: 30px; border-radius: 50%;
    background: #e8e8e6; margin-top: -13.5px;
  }
  input[type=range]::-moz-range-track { height: 3px; background: #333331; border-radius: 2px; }
  input[type=range]::-moz-range-thumb {
    width: 30px; height: 30px; border: none; border-radius: 50%; background: #e8e8e6;
  }
  .presets { display: flex; gap: 8px; margin-bottom: 28px; }
  .presets button {
    flex: 1; padding: 12px 0; font-size: 14px;
    background: #1c1c1b; color: #c9c9c5;
    border: 1px solid #2e2e2c; border-radius: 10px;
    font-family: inherit; cursor: pointer;
  }
  .presets button.on { background: #e8e8e6; color: #111111; border-color: #e8e8e6; }
  #play {
    width: 100%; padding: 22px 0; font-size: 18px; font-weight: 500;
    background: #e8e8e6; color: #111111;
    border: none; border-radius: 14px;
    font-family: inherit; cursor: pointer;
  }
  #play.playing { background: #1c1c1b; color: #e8e8e6; border: 1px solid #333331; }
  #play.busy { background: #2a2a28; color: #8a8a86; }
  .hint { text-align: center; font-size: 12px; color: #6a6a66; margin-top: 16px; line-height: 1.6; }
</style>
</head>
<body>

<div class="wrap">

  <div class="readout">
    <div class="hz" id="hz">60<span>Hz</span></div>
    <div class="note" id="note">&nbsp;</div>
  </div>

  <div class="field">
    <div class="label"><span>frequency</span><span id="fout">60 Hz</span></div>
    <input type="range" id="freq" min="20" max="400" step="1" value="60" />
  </div>

  <div class="field">
    <div class="label"><span>level</span><span id="vout">50%</span></div>
    <input type="range" id="vol" min="1" max="100" step="1" value="50" />
  </div>

  <div class="presets" id="presets">
    <button data-f="40">40</button>
    <button data-f="60">60</button>
    <button data-f="80">80</button>
    <button data-f="110">110</button>
    <button data-f="146">146</button>
  </div>

  <button id="play">Play</button>

  <div class="hint" id="hint">Plays with the screen locked. Use your phone's volume buttons too.</div>

  <audio id="audio" loop playsinline preload="auto"></audio>

</div>

<script>
(function () {
  var RATE = 11025;
  var MINUTES = 10;
  var FADE = 0.3;

  var freq = document.getElementById('freq');
  var vol = document.getElementById('vol');
  var hz = document.getElementById('hz');
  var fout = document.getElementById('fout');
  var vout = document.getElementById('vout');
  var note = document.getElementById('note');
  var play = document.getElementById('play');
  var presets = document.getElementById('presets');
  var hint = document.getElementById('hint');
  var audio = document.getElementById('audio');

  var playing = false;
  var building = false;
  var builtFor = null;
  var currentUrl = null;
  var pending = null;

  function say(text, cls) {
    note.textContent = text || ' ';
    note.className = 'note' + (cls ? ' ' + cls : '');
  }

  function hzValue() { return parseInt(freq.value, 10); }
  function level() { return Math.pow(parseInt(vol.value, 10) / 100, 1.4) * 0.9; }
  function signature() { return freq.value + ':' + vol.value; }

  function buildBuffer(frequency, amp) {
    var cycles = Math.max(1, Math.round(MINUTES * 60 * frequency));
    var frames = Math.round(cycles / frequency * RATE);
    var nbytes = frames * 2;

    var buffer = new ArrayBuffer(44 + nbytes);
    var view = new DataView(buffer);

    function str(off, s) {
      for (var i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i));
    }

    str(0, 'RIFF');
    view.setUint32(4, 36 + nbytes, true);
    str(8, 'WAVE');
    str(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, RATE, true);
    view.setUint32(28, RATE * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    str(36, 'data');
    view.setUint32(40, nbytes, true);

    var step = 2 * Math.PI * frequency / RATE;
    var peak = amp * 32767;
    var fadeFrames = Math.round(FADE * RATE);

    for (var n = 0; n < frames; n++) {
      var env = 1;
      if (n < fadeFrames) {
        env = 0.5 - 0.5 * Math.cos(Math.PI * n / fadeFrames);
      } else if (n >= frames - fadeFrames) {
        env = 0.5 - 0.5 * Math.cos(Math.PI * (frames - 1 - n) / fadeFrames);
      }
      view.setInt16(44 + n * 2, Math.round(Math.sin(step * n) * peak * env), true);
    }

    return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
  }

  function setMeta() {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: hzValue() + ' Hz',
        artist: 'Drone'
      });
      navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
    } catch (e) {}
  }

  function setButton() {
    if (building) {
      play.textContent = 'Building…';
      play.className = 'busy';
    } else if (playing) {
      play.textContent = 'Stop';
      play.className = 'playing';
    } else {
      play.textContent = 'Play';
      play.className = '';
    }
  }

  function ensureBuffer(done) {
    var sig = signature();
    if (sig === builtFor && currentUrl) { done(); return; }
    if (building) { pending = done; return; }

    building = true;
    setButton();

    requestAnimationFrame(function () {
      setTimeout(function () {
        var url = buildBuffer(hzValue(), level());
        var old = currentUrl;
        currentUrl = url;
        builtFor = sig;
        audio.src = url;
        audio.load();
        if (old) setTimeout(function () { URL.revokeObjectURL(old); }, 2000);

        building = false;
        setMeta();
        setButton();

        var next = pending; pending = null;
        done();
        if (next) next();
      }, 0);
    });
  }

  function start() {
    ensureBuffer(function () {
      audio.play().then(function () {
        playing = true;
        setButton();
        setMeta();
        refreshNote();
      }).catch(function (err) {
        say('Could not start: ' + err.name + ' — tap Play again', 'warn');
      });
    });
  }

  function stop() {
    audio.pause();
    playing = false;
    setButton();
    setMeta();
  }

  function speakerNote() {
    var f = hzValue();
    if (f < 50) return ['Below most speaker and earbud response — use headphones', 'warn'];
    if (f < 90) return ['Laptop speakers barely reproduce this — use headphones', 'warn'];
    return ['', ''];
  }

  function refreshNote() {
    var s = speakerNote();
    say(s[0], s[1]);
  }

  function paint() {
    var f = hzValue();
    hz.innerHTML = f + '<span>Hz</span>';
    fout.textContent = f + ' Hz';
    vout.textContent = parseInt(vol.value, 10) + '%';
    var kids = presets.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].classList.toggle('on', parseInt(kids[i].dataset.f, 10) === f);
    }
    refreshNote();
  }

  function settled() {
    if (signature() === builtFor) return;
    if (playing) {
      ensureBuffer(function () { audio.play().catch(function () {}); });
    } else {
      builtFor = null;
    }
  }

  freq.addEventListener('input', paint);
  vol.addEventListener('input', paint);
  freq.addEventListener('change', settled);
  vol.addEventListener('change', settled);

  presets.addEventListener('click', function (e) {
    if (e.target.tagName !== 'BUTTON') return;
    freq.value = e.target.dataset.f;
    paint();
    settled();
  });

  play.addEventListener('click', function () {
    if (building) return;
    if (playing) stop(); else start();
  });

  audio.addEventListener('ended', function () {
    if (playing) { audio.currentTime = 0; audio.play().catch(function () {}); }
  });

  audio.addEventListener('pause', function () {
    if (playing && !audio.ended) { playing = false; setButton(); setMeta(); }
  });

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', function () { if (!playing) start(); });
      navigator.mediaSession.setActionHandler('pause', function () { if (playing) stop(); });
    } catch (e) {}
  }

  if (location.protocol === 'file:') {
    hint.textContent = 'Opened as a local file — background playback needs a real URL.';
  }

  paint();
  setButton();
})();
</script>
</body>
</html>
