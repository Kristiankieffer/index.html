<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#111111" />
<title>Drone</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #111111;
    color: #e8e8e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 22px calc(24px + env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
  }
  .wrap { width: 100%; max-width: 420px; }
  .readout { text-align: center; margin-bottom: 30px; }
  .hz { font-size: 64px; font-weight: 300; letter-spacing: -0.02em; line-height: 1; }
  .hz span { font-size: 24px; color: #8a8a86; margin-left: 6px; }
  .note { font-size: 13px; color: #8a8a86; margin-top: 12px; min-height: 34px; line-height: 1.5; }
  .note.warn { color: #d8a35c; }
  .field { margin-bottom: 24px; }
  .label {
    display: flex; justify-content: space-between;
    font-size: 13px; color: #8a8a86; margin-bottom: 12px;
    letter-spacing: 0.02em;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 34px; background: transparent; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; background: #333331; border-radius: 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 30px; height: 30px; border-radius: 50%;
    background: #e8e8e6; margin-top: -13.5px;
  }
  input[type=range]::-moz-range-track { height: 3px; background: #333331; border-radius: 2px; }
  input[type=range]::-moz-range-thumb {
    width: 30px; height: 30px; border: none; border-radius: 50%; background: #e8e8e6;
  }
  .presets { display: flex; gap: 8px; margin-bottom: 28px; }
  .presets button {
    flex: 1; padding: 12px 0; font-size: 14px;
    background: #1c1c1b; color: #c9c9c5;
    border: 1px solid #2e2e2c; border-radius: 10px;
    font-family: inherit; cursor: pointer;
  }
  .presets button.on { background: #e8e8e6; color: #111111; border-color: #e8e8e6; }
  #play {
    width: 100%; padding: 22px 0; font-size: 18px; font-weight: 500;
    background: #e8e8e6; color: #111111;
    border: none; border-radius: 14px;
    font-family: inherit; cursor: pointer;
  }
  #play.playing { background: #1c1c1b; color: #e8e8e6; border: 1px solid #333331; }
  .hint { text-align: center; font-size: 12px; color: #6a6a66; margin-top: 16px; line-height: 1.6; }
</style>
</head>
<body>

<div class="wrap">

  <div class="readout">
    <div class="hz" id="hz">60<span>Hz</span></div>
    <div class="note" id="note">&nbsp;</div>
  </div>

  <div class="field">
    <div class="label"><span>frequency</span><span id="fout">60 Hz</span></div>
    <input type="range" id="freq" min="20" max="400" step="1" value="60" />
  </div>

  <div class="field">
    <div class="label"><span>level</span><span id="vout">50%</span></div>
    <input type="range" id="vol" min="1" max="100" step="1" value="50" />
  </div>

  <div class="presets" id="presets">
    <button data-f="40">40</button>
    <button data-f="60">60</button>
    <button data-f="80">80</button>
    <button data-f="110">110</button>
    <button data-f="146">146</button>
  </div>

  <button id="play">Play</button>

  <div class="hint" id="hint">Continuous tone. Keeps playing with the screen locked.</div>

  <audio id="keeper" loop playsinline preload="auto"></audio>

</div>

<script>
(function () {
  var freq = document.getElementById('freq');
  var vol = document.getElementById('vol');
  var hz = document.getElementById('hz');
  var fout = document.getElementById('fout');
  var vout = document.getElementById('vout');
  var note = document.getElementById('note');
  var play = document.getElementById('play');
  var presets = document.getElementById('presets');
  var hint = document.getElementById('hint');
  var keeper = document.getElementById('keeper');

  var ctx = null, osc = null, gain = null;
  var playing = false;

  function say(text, cls) {
    note.textContent = text || ' ';
    note.className = 'note' + (cls ? ' ' + cls : '');
  }

  function level() {
    return Math.pow(parseInt(vol.value, 10) / 100, 1.4) * 0.9;
  }

  function hzValue() {
    return parseInt(freq.value, 10);
  }

  function silentLoop() {
    var RATE = 8000, SECONDS = 2, FREQ = 50;
    var frames = RATE * SECONDS;
    var nbytes = frames * 2;
    var buffer = new ArrayBuffer(44 + nbytes);
    var view = new DataView(buffer);

    function str(off, s) {
      for (var i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i));
    }

    str(0, 'RIFF');
    view.setUint32(4, 36 + nbytes, true);
    str(8, 'WAVE');
    str(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, RATE, true);
    view.setUint32(28, RATE * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    str(36, 'data');
    view.setUint32(40, nbytes, true);

    var step = 2 * Math.PI * FREQ / RATE;
    for (var n = 0; n < frames; n++) {
      view.setInt16(44 + n * 2, Math.round(Math.sin(step * n) * 2), true);
    }

    var bytes = new Uint8Array(buffer), CHUNK = 0x8000, parts = [];
    for (var i = 0; i < bytes.length; i += CHUNK) {
      parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK)));
    }
    return 'data:audio/wav;base64,' + btoa(parts.join(''));
  }

  function setMeta() {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: hzValue() + ' Hz',
        artist: 'Drone'
      });
      navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
    } catch (e) {}
  }

  function start() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();

    keeper.play().catch(function () {});

    gain = ctx.createGain();
    gain.gain.value = 0;
    osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = hzValue();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    gain.gain.setTargetAtTime(level(), ctx.currentTime, 0.35);

    playing = true;
    play.textContent = 'Stop';
    play.classList.add('playing');
    setMeta();
  }

  function stop() {
    if (osc) {
      var o = osc;
      gain.gain.setTargetAtTime(0, ctx.currentTime, 0.18);
      setTimeout(function () { try { o.stop(); o.disconnect(); } catch (e) {} }, 900);
      osc = null; gain = null;
    }
    keeper.pause();
    playing = false;
    play.textContent = 'Play';
    play.classList.remove('playing');
    setMeta();
  }

  function apply() {
    if (!osc) return;
    osc.frequency.setTargetAtTime(hzValue(), ctx.currentTime, 0.06);
    gain.gain.setTargetAtTime(level(), ctx.currentTime, 0.06);
  }

  function speakerNote() {
    var f = hzValue();
    if (f < 50) return ['Below most speaker and earbud response — use headphones', 'warn'];
    if (f < 90) return ['Laptop speakers barely reproduce this — use headphones', 'warn'];
    return ['', ''];
  }

  function paint() {
    var f = hzValue();
    hz.innerHTML = f + '<span>Hz</span>';
    fout.textContent = f + ' Hz';
    vout.textContent = parseInt(vol.value, 10) + '%';
    var kids = presets.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].classList.toggle('on', parseInt(kids[i].dataset.f, 10) === f);
    }
    var s = speakerNote();
    say(s[0], s[1]);
  }

  freq.addEventListener('input', function () { paint(); apply(); setMeta(); });
  vol.addEventListener('input', function () { paint(); apply(); });

  presets.addEventListener('click', function (e) {
    if (e.target.tagName !== 'BUTTON') return;
    freq.value = e.target.dataset.f;
    paint(); apply(); setMeta();
  });

  play.addEventListener('click', function () {
    if (playing) stop(); else start();
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && playing && ctx && ctx.state === 'suspended') {
      ctx.resume();
      keeper.play().catch(function () {});
    }
  });

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', function () { if (!playing) start(); });
      navigator.mediaSession.setActionHandler('pause', function () { if (playing) stop(); });
    } catch (e) {}
  }

  keeper.volume = 1;
  keeper.src = silentLoop();

  if (location.protocol === 'file:') {
    hint.textContent = 'Opened as a local file — background playback needs a real URL.';
  }

  paint();
})();
</script>
</body>
</html>
